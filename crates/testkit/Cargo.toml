[package]
name = "sigill-testkit"
description = "Test helpers for Sigill: fake SMTP server, DKIM test keys and config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sigill-core.workspace = true
sigill-render.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt", "macros"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rcgen = { workspace = true, features = ["ring", "pem"] }
smtp-proto.workspace = true
tempfile.workspace = true
