# Local development: Mailpit catches everything Sigill sends in smarthost mode.
#   docker compose up -d
#   SMTP on localhost:1025, web UI on http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
