# Continuous replication of the Sigill database to Hetzner Object Storage.
# Install as /etc/litestream.yml. Credentials come from LITESTREAM_ACCESS_KEY_ID and
# LITESTREAM_SECRET_ACCESS_KEY in /etc/sigill/litestream.env.
dbs:
  - path: /var/lib/sigill/sigill.db
    replicas:
      - type: s3
        bucket: sigill-backups            # replace
        path: sigill.db
        # Bucket location: fsn1, nbg1 or hel1. Prefer a different one from the server's.
        endpoint: https://fsn1.your-objectstorage.com
        region: fsn1
        force-path-style: true
        sync-interval: 1s
        snapshot-interval: 24h
        retention: 168h                   # keep a week of snapshots and WAL
        # Optional client-side encryption (the database holds recipient addresses and
        # message bodies). Generate a key with `age-keygen`, keep the identity with the
        # master key, and uncomment:
        # age:
        #   recipients: [age1...]
        #   identities: [AGE-SECRET-KEY-1...]
