[workspace]
resolver = "3"
members = ["crates/*", "bin/sigill"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ErikHellman/sigill"
rust-version = "1.98"

[workspace.dependencies]
sigill-core = { path = "crates/core" }
sigill-store = { path = "crates/store" }
sigill-render = { path = "crates/render" }
sigill-mta = { path = "crates/mta" }
sigill-bounce = { path = "crates/bounce" }
sigill-api = { path = "crates/api" }
sigill-webhook = { path = "crates/webhook" }
sigill-testkit = { path = "crates/testkit" }

tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7", default-features = false }
axum = { version = "0.8", default-features = false }
askama = { version = "0.16", default-features = false }
sqlx = { version = "0.9", default-features = false }
minijinja = { version = "3.1", default-features = false }
mrml = { version = "6", default-features = false }
mail-builder = { version = "2", default-features = false }
mail-auth = { version = "0.15", default-features = false }
smtp-proto = { version = "0.2", default-features = false }
mail-parser = { version = "1", default-features = false }
quick-xml = { version = "0.41", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
hickory-resolver = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
reqwest = { version = "0.13", default-features = false }
figment = { version = "0.10", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
argon2 = { version = "0.5", default-features = false }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false }
clap = { version = "4", default-features = false }
getrandom = "0.3"
vaka-sdk = { git = "https://github.com/ErikHellman/vaka", default-features = false }
insta = { version = "1", default-features = false }
tempfile = "3"
rcgen = { version = "0.14", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"

# RSA key generation and signing are painfully slow unoptimised; these build once.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Argon2id API-key hashing takes ~1 s per verify unoptimised.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
